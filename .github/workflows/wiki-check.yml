name: Check wiki build

# Catches broken cross-document links and duplicate page names on the pull
# request, rather than after they have already been published to the wiki.

on:
  pull_request:
    paths:
      - '**.md'
      - 'wiki.config.json'
      - 'tools/wiki_sync.py'
      - '.github/workflows/wiki-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate wiki build
        run: python tools/wiki_sync.py --check
