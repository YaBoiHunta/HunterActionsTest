name: Sync docs to wiki

# Mirrors every Markdown file in the repository into the GitHub Wiki.
#
# Authentication: the default GITHUB_TOKEN is refused by *.wiki.git on many
# accounts even with contents:write, so a WIKI_TOKEN secret (a PAT with repo
# scope) is preferred when present. Set one with:
#   gh secret set WIKI_TOKEN

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - 'wiki.config.json'
      - 'tools/wiki_sync.py'
      - '.github/workflows/wiki-sync.yml'
  workflow_dispatch:

concurrency:
  group: wiki-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history so the generator can date each page from git log.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build wiki pages
        run: python tools/wiki_sync.py --out .wiki-build --branch "${{ github.ref_name }}"

      - name: Push to wiki
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN || secrets.GITHUB_TOKEN }}
          USING_PAT: ${{ secrets.WIKI_TOKEN != '' }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$USING_PAT" != "true" ]; then
            echo "::warning::WIKI_TOKEN is not set, falling back to GITHUB_TOKEN. Wiki pushes are rejected for GITHUB_TOKEN on some accounts, reported as either 403 or a misleading 'Repository not found'. If this step fails on access, run 'gh secret set WIKI_TOKEN' with a PAT that has repo scope."
          fi

          wiki_url="https://x-access-token:${WIKI_TOKEN}@github.com/${REPO}.wiki.git"
          work="$(mktemp -d)"

          # Enabling the wiki does not create its backing git repo. GitHub only
          # creates it when the first page is saved in the web UI, and there is
          # no API to do that, so this cannot be automated away.
          if ! git ls-remote "$wiki_url" >/dev/null 2>&1; then
            echo "::error::The wiki for ${REPO} has no backing git repository yet. Open https://github.com/${REPO}/wiki, click 'Create the first page', and save it (any content, it is overwritten by this workflow). Then re-run this workflow. If the wiki tab is missing entirely, enable it with 'gh repo edit --enable-wiki'."
            exit 1
          fi

          # An existing wiki can still be empty if every page was deleted.
          if git clone --depth 1 "$wiki_url" "$work" 2>/dev/null \
             && git -C "$work" rev-parse HEAD >/dev/null 2>&1; then
            bootstrap=false
            echo "Cloned existing wiki."
          else
            bootstrap=true
            rm -rf "$work"
            mkdir -p "$work"
            git -C "$work" init -q
            git -C "$work" remote add origin "$wiki_url"
            echo "::notice::Wiki repository is empty; creating the initial commit."
          fi

          # --checksum because rsync's default size+mtime quick check misses
          # _Footer.md: it differs only by a fixed-length commit SHA, so its size
          # never changes, and the build and clone often land in the same second.
          rsync -a --checksum --delete --exclude '.git' .wiki-build/ "$work"/

          cd "$work"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Wiki is already up to date."
            exit 0
          fi

          git commit -q -m "Sync wiki from ${REPO}@${SHA:0:7}"

          if [ "$bootstrap" = "true" ]; then
            # Wiki repos are created with master, but do not assume it.
            git push -q --force origin HEAD:master || git push -q --force origin HEAD:main
          else
            git push -q origin HEAD
          fi

          echo "Pushed wiki update: https://github.com/${REPO}/wiki"
